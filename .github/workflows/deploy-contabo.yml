name: Deploy (Contabo)

# Builds the Docker image, pushes it to GitHub's registry, and restarts the app on the
# Contabo server over SSH. Runs after CI passes on main. Does nothing unless the
# CONTABO_HOST repository variable is set. Setup: deploy/README.md.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: vars.CONTABO_HOST != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/hidl
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.SHA }},${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            GIT_SHA=${{ env.SHA }}
      - name: Restart on the server
        env:
          SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          HOST: ${{ vars.CONTABO_HOST }}
          USER: ${{ vars.CONTABO_USER || 'deploy' }}
          # This job's own token (packages: read is implied by write), so the server can pull the
          # private image without a long-lived personal token stored on it. Logged out right after.
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/key && printf '%s\n' "$SSH_KEY" > ~/key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/key "$USER@$HOST" "docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null && cd /opt/hidl && HIDL_TAG=$SHA docker compose pull web; rc=\$?; docker logout ghcr.io >/dev/null; [ \$rc -eq 0 ] && HIDL_TAG=$SHA docker compose up -d --remove-orphans && docker image prune -f"
