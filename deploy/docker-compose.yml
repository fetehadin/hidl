# hidl on the Contabo VPS. Lives in /opt/hidl next to a .env file (see deploy/env.example).
# `docker compose up -d` starts the app; add `--profile edge` only if no other reverse proxy
# already owns ports 80/443 on the server.
services:
  web:
    image: ghcr.io/fetehadin/hidl:${HIDL_TAG:-latest}
    env_file: .env
    restart: unless-stopped
    # Localhost only, for a reverse proxy already running on the host (nginx, host Caddy). Never public.
    ports: ["127.0.0.1:${HIDL_PORT:-3000}:3000"]
    # The Android app's .apk, served at /download/android (src/app/download/android/route.ts).
    # Publish a new build by copying it to /opt/hidl/downloads/hidl.apk; no restart needed.
    volumes:
      - ./downloads:/app/downloads:ro

  # The daily unlock-email job at 05:00 UTC.
  cron:
    image: alpine:3.20
    env_file: .env
    restart: unless-stopped
    depends_on: [web]
    # The secret is written into the crontab when the container starts, because busybox crond
    # doesn't reliably hand the container's environment to its jobs.
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null
        echo "0 5 * * * curl -fsS -H 'Authorization: Bearer $$CRON_SECRET' http://web:3000/api/cron/unlock-emails" | crontab -
        exec crond -f -l 6

  # Photo and video files: Garage, a small S3-compatible store (docs/storage.md). Only with
  # COMPOSE_PROFILES=media in .env, after deploy/media/setup-disk.sh made its own 40 GB disk.
  # The data folders must already exist on that disk: if it isn't mounted, Garage refuses to start
  # instead of quietly filling the server's main disk.
  garage:
    profiles: ["media"]
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    # Localhost only, for the nightly backup (rclone). Browsers reach it through the reverse proxy.
    ports: ["127.0.0.1:3900:3900"]
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - type: bind
        source: /srv/hidl-media/meta
        target: /var/lib/garage/meta
        bind: { create_host_path: false }
      - type: bind
        source: /srv/hidl-media/data
        target: /var/lib/garage/data
        bind: { create_host_path: false }

  caddy:
    profiles: ["edge"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      HIDL_DOMAIN: ${HIDL_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]

volumes:
  caddy_data:
