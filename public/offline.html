<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c8e6e2" />
    <meta name="color-scheme" content="light" />
    <title>You're offline · hidl</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: radial-gradient(120% 80% at 50% 0%, #ffffff 0%, #e3f3f0 45%, #c8e6e2 100%);
        color: #1f3b3f;
        font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main {
        width: min(100%, 24rem);
        background: #fff;
        border: 1px solid #9ed5d1;
        border-radius: 28px;
        padding: 32px 24px;
        box-shadow: 0 12px 32px -16px rgb(16 95 104 / 0.35);
      }
      img { width: 120px; height: auto; }
      h1 { margin: 12px 0 6px; color: #105f68; font-size: 1.75rem; line-height: 1.2; }
      p { margin: 0 0 22px; color: #34595c; }
      button {
        font: inherit;
        font-size: 1.1875rem;
        font-weight: 700;
        color: #fff;
        background: #3a9295;
        border: 0;
        border-bottom: 4px solid #105f68;
        border-radius: 16px;
        padding: 12px 28px;
        cursor: pointer;
      }
      button:hover { background: #105f68; }
      button:active { border-bottom-width: 1px; transform: translateY(3px); }
      button:focus-visible { outline: 3px solid #105f68; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/email/hidi-wave.png" alt="" width="120" height="137" />
      <h1>You're offline</h1>
      <p>hidl needs a connection to open your journal. Your letters and photos are safe. Try again once you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
